
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scratch: Кейіпкерлер тілдесуі</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .mirror-video { transform: scaleX(-1); }
    .scratch-block {
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
      color: #fff;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .scratch-block:active { cursor: grabbing; transform: scale(0.98); }
    .block-looks { background-color: #9966ff; }
    .block-control { background-color: #ffab19; color: #1e293b; }
    .drop-zone {
      min-height: 54px;
      border-radius: 10px;
      border: 1.5px dashed rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.65);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drop-zone.drag-over {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
    }
    #hand-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 3px solid #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
    }
    #hand-cursor.pinching {
      background: #22c55e;
      border-color: #bbf7d0;
      transform: translate(-50%, -50%) scale(1.25);
    }
  </style>
</head>
<body class="p-2 sm:p-4">
  <div id="hand-cursor"></div>

  <div class="max-w-6xl mx-auto space-y-3">
    <!-- Жоғарғы панель -->
    <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col gap-2.5 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <h1 class="text-base sm:text-xl font-extrabold text-white">
          Scratch: «Келбет» және «Басқару» блоктарымен диалог құру
        </h1>
        <p class="text-xs sm:text-sm text-slate-400">
          Блоктарды саусақпен/тынтуірмен сүйреп немесе басып орналастырыңыз
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="toggle-camera-btn" type="button" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-600 hover:bg-sky-500 text-white">
          Камераны қосу
        </button>
        <button id="run-btn" type="button" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950">
          ▶ Іске қосу
        </button>
        <button id="reset-btn" type="button" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-700 hover:bg-slate-600 text-white">
          ↺ Қайта бастау
        </button>
      </div>
    </header>

    <!-- Камера терезесі (қосылғанда көрінеді) -->
    <section id="camera-panel" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span id="camera-status" class="text-xs sm:text-sm text-sky-300 font-semibold">Камера дайындалуда...</span>
        <span class="text-xs text-slate-400">Бас бармақ пен сұқ саусақты түйістіріп ұстаңыз</span>
      </div>
      <div class="relative w-full max-w-sm
